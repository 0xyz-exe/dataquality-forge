[project]
name = "dataquality-forge"
version = "0.1.0"
description = "Open-Source Data Quality Profiling & Validation Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "0xyz-exe" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "sqlalchemy>=2.0.35",
    "duckdb>=1.1.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "typer>=0.12.5",
    "python-multipart>=0.0.12",
    "jinja2>=3.1.4",
    "httpx>=0.27.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[project.scripts]
dataquality = "dataquality_forge.cli:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
